<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body { margin:0; padding:0; height:100%; background:transparent; overflow:hidden; display:flex; justify-content:center; align-items:flex-end; }
  .cat {
    width: 100px; height: 100px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="20" y="40" width="60" height="40" fill="%23fbbf24"/><rect x="20" y="20" width="20" height="20" fill="%23fbbf24"/><rect x="60" y="20" width="20" height="20" fill="%23fbbf24"/><rect x="30" y="50" width="10" height="10" fill="%23000"/><rect x="60" y="50" width="10" height="10" fill="%23000"/><rect x="25" y="70" width="15" height="15" fill="%23fbbf24"/><rect x="60" y="70" width="15" height="15" fill="%23fbbf24"/></svg>');
    background-size: contain;
    background-repeat: no-repeat;
    animation: bob 0.8s infinite alternate;
  }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-10px); } }
</style>
</head>
<body>
  <div class="cat"></div>
</body>
</html>
