<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; height: 100vh; background: transparent; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  .chara { width: 160px; height: 160px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .eye { transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .ahoge { transform-origin: bottom center; animation: sway 2s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
</style>
</head>
<body>
  <div class="chara">
    <svg viewBox="0 0 200 200">
      <!-- 呆毛 -->
      <path class="ahoge" d="M 100 40 Q 110 10 120 30" stroke="#2d3748" stroke-width="4" fill="none" stroke-linecap="round"/>
      
      <!-- 头发底座 -->
      <ellipse cx="100" cy="90" rx="55" ry="50" fill="#1a202c"/>
      
      <!-- 女仆头饰 (白色荷叶边) -->
      <path d="M 60 60 Q 100 30 140 60 Q 130 70 120 55 Q 100 75 80 55 Q 70 70 60 60 Z" fill="#f8fafc"/>
      <circle cx="100" cy="45" r="8" fill="#f8fafc"/>
      
      <!-- 脸 -->
      <ellipse cx="100" cy="100" rx="42" ry="38" fill="#ffe9dc"/>
      
      <!-- 刘海 -->
      <path d="M 55 90 Q 70 60 100 65 Q 130 60 145 90 Q 120 75 100 85 Q 80 75 55 90 Z" fill="#1a202c"/>
      
      <!-- 眼睛 -->
      <g class="eye">
        <!-- 左眼 -->
        <ellipse cx="80" cy="105" rx="8" ry="12" fill="#fff"/>
        <ellipse cx="80" cy="107" rx="6" ry="9" fill="#2b6cb0"/>
        <circle cx="78" cy="103" r="3" fill="#fff"/>
        <!-- 右眼 -->
        <ellipse cx="120" cy="105" rx="8" ry="12" fill="#fff"/>
        <ellipse cx="120" cy="107" rx="6" ry="9" fill="#2b6cb0"/>
        <circle cx="118" cy="103" r="3" fill="#fff"/>
      </g>
      
      <!-- 腮红和嘴巴 -->
      <ellipse cx="70" cy="118" rx="8" ry="4" fill="#fb7185" opacity="0.5"/>
      <ellipse cx="130" cy="118" rx="8" ry="4" fill="#fb7185" opacity="0.5"/>
      <path d="M 96 120 Q 100 125 104 120" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round"/>
      
      <!-- 身体和女仆装 (黑色) -->
      <path d="M 60 140 Q 100 130 140 140 L 150 200 L 50 200 Z" fill="#2d3748"/>
      
      <!-- 白色围裙 -->
      <path d="M 70 150 Q 100 145 130 150 L 140 200 L 60 200 Z" fill="#f8fafc"/>
      <path d="M 70 150 Q 100 165 130 150" stroke="#e2e8f0" stroke-width="3" fill="none"/>
      
      <!-- 红色蝴蝶结领结 -->
      <path d="M 90 140 L 80 135 L 85 145 Z" fill="#e53e3e"/>
      <path d="M 110 140 L 120 135 L 115 145 Z" fill="#e53e3e"/>
      <circle cx="100" cy="140" r="4" fill="#c53030"/>
    </svg>
  </div>
</body>
</html>
