<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body { margin:0; padding:0; height:100%; background:transparent; overflow:hidden; display:flex; justify-content:center; align-items:center; }
  .circle { width: 100px; height: 100px; background: #38bdf8; border-radius: 50%; animation: float 3s infinite; box-shadow: 0 0 20px #38bdf8; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>
  <div class="circle"></div>
</body>
</html>
