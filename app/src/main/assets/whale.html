<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;display:flex;justify-content:center;align-items:center;}
  svg { width: 100%; height: 100%; overflow: visible; }
  
  /* 整体呼吸浮动 */
  .yeqiu-group {
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* 眨眼动画 */
  .eye {
    animation: blink 4s infinite;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  /* 烟圈飘动 */
  .smoke {
    animation: rise 3s infinite linear;
    opacity: 0;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    20% { opacity: 0.8; }
    100% { transform: translateY(-25px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
  <g class="yeqiu-group">
    <!-- 身体（兴欣队服） -->
    <path d="M 50 160 Q 100 140 150 160 L 170 200 L 30 200 Z" fill="#f8f9fa"/>
    <path d="M 80 145 L 100 170 L 120 145 Z" fill="#e53935"/> <!-- 红领口 -->
    
    <!-- 脖子 -->
    <rect x="85" y="130" width="30" height="25" rx="10" fill="#fce4d6"/>

    <!-- 电竞耳机 -->
    <path d="M 45 90 A 55 55 0 0 1 155 90" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    <rect x="35" y="90" width="20" height="40" rx="10" fill="#444"/>
    <rect x="145" y="90" width="20" height="40" rx="10" fill="#444"/>

    <!-- 头 (脸) -->
    <ellipse cx="100" cy="100" rx="50" ry="45" fill="#fce4d6"/>

    <!-- 头发（纯黑色，凌乱形状） -->
    <path d="M 45 100 Q 40 50 100 45 Q 160 50 155 100 Q 140 70 110 80 Q 100 60 80 80 Q 60 70 45 100 Z" fill="#111111"/>
    <path d="M 45 100 Q 60 90 80 110 Q 90 80 110 110 Q 130 80 155 100 Z" fill="#222222"/>

    <!-- 眼睛（半睁的颓废眼） -->
    <g class="eye" transform="translate(75, 105)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="3" fill="#1a1a1a"/>
    </g>
    <g class="eye" transform="translate(125, 105)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="3" fill="#1a1a1a"/>
    </g>

    <!-- 嘴巴（叼着烟） -->
    <path d="M 95 120 Q 100 125 105 120" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="102" y="118" width="25" height="4" rx="2" fill="#fff" transform="rotate(15 102 118)"/>
    <circle cx="126" cy="124" r="2" fill="#ff5722"/> <!-- 烟头火光 -->

    <!-- 烟圈动画 -->
    <circle class="smoke" cx="128" cy="110" r="4" fill="none" stroke="#ddd" stroke-width="2"/>
    <circle class="smoke" cx="132" cy="100" r="6" fill="none" stroke="#ddd" stroke-width="2" style="animation-delay: 1s;"/>
    <circle class="smoke" cx="125" cy="90" r="8" fill="none" stroke="#ddd" stroke-width="2" style="animation-delay: 2s;"/>

    <!-- 握着千机伞的手 -->
    <path d="M 160 160 L 180 140" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <path d="M 175 145 L 195 120" stroke="#bdbdbd" stroke-width="4" stroke-linecap="round"/> <!-- 伞柄 -->
    <!-- 撑开的千机伞 -->
    <path d="M 185 125 L 150 80 L 215 60 Z" fill="#e53935" opacity="0.9"/>
    <path d="M 150 80 L 185 125 L 215 60" fill="none" stroke="#fff" stroke-width="1"/>
  </g>
</svg>
</body>
</html>
